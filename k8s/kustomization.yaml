apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - service.yaml
  - deployment-blue.yaml
  - deployment-green.yaml

images:
  - name: test-cd-app-blue
    newName: marlyt/test-cd-app
    newTag: initial-sha
  - name: test-cd-app-green
    newName: marlyt/test-cd-app
    newTag: initial-sha

patches:
  - target:
      kind: Service
      name: test-cd-app
    patch: |-
      - op: replace
        path: /spec/selector/slot
        value: blue