#Deploys flask-app to cloud-based Kubernetes cluster
name: CD Workflow

on:
  workflow_run:
    workflows: [ CI Workflow ]
    types:
      - completed
    branches: [ main ]

jobs:

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
      id-token: write
    env:
      IMAGE_NAME: test-cd-app
      NAMESPACE: default

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK & GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: "my-cluster-gitops"
          location: "us-central1"

      - name: Install Kustomize
        run: |
          curl -sL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.3/kustomize_v5.8.3_linux_amd64.tar.gz | tar xz
          sudo mv kustomize /usr/local/bin/
          kustomize version
          

      - name: Determine active and target slots
        id: slots
        run: |
          ACTIVE_SLOT=$(kubectl get service test-cd-app -n "${{ env.NAMESPACE }}" -o jsonpath='{.spec.selector.slot}' 2>/dev/null || echo "blue")
          if [ "$ACTIVE_SLOT" == "blue" ]; then
            TARGET_SLOT="green"
          else
            TARGET_SLOT="blue"
          fi
          echo "active=$ACTIVE_SLOT" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET_SLOT" >> "$GITHUB_OUTPUT"
          echo "Active slot: $ACTIVE_SLOT | Deploying to target slot: $TARGET_SLOT"

      - name: Update inactive slot image tag in kustomization.yaml
        env:
          TARGET_SLOT: ${{ steps.slots.outputs.target }}
        run: |
          cd k8s
          kustomize edit set image "test-cd-app-${TARGET_SLOT}="${DOCKER_USERNAME}/test-cd-app:${GITHUB_SHA}""

      - name: Deploy inactive slot and wait for readiness
        env:
          TARGET_SLOT: ${{ steps.slots.outputs.target }}
        run: |
          kubectl apply -k k8s/ -n "${{ env.NAMESPACE }}"
          kubectl rollout status "deployment/test-cd-app-${TARGET_SLOT}" -n "${{ env.NAMESPACE }}" --timeout=5m

      - name: Switch Service selector to target slot
        env:
          TARGET_SLOT: ${{ steps.slots.outputs.target }}
        run: |
          yq eval '(.patches[] | select(.target.name == "test-cd-app") | .patch) |= sub("value: (blue|green)", "value: " + env(TARGET_SLOT))' -i k8s/kustomization.yaml
          kubectl apply -k k8s/ -n "${{ env.NAMESPACE }}"

      - name: Commit updated kustomization.yaml
        env:
          TARGET_SLOT: ${{ steps.slots.outputs.target }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git diff --staged --quiet || git commit -m "chore(k8s): deploy ${{ github.sha }} to ${TARGET_SLOT} [skip ci]"
          git push

