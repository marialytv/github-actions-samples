apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: flask-app
spec:
  replicas: 4
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
        - name: flask-app
          image: marlyt/test-cd-app:182330bc1759d36983b0a7dc30fb265913e95b4c
          ports:
            - containerPort: 8050
          readinessProbe:
            httpGet:
              path: /
              port: 8050
            initialDelaySeconds: 3
            periodSeconds: 5
  strategy:
    blueGreen:
      activeService: flask-app-active
      previewService: flask-app-preview
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 30