apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - service.yaml
  - deployment-blue.yaml
  - deployment-green.yaml
images:
  - name: test-cd-app-blue
    newName: marlyt/test-cd-app
    newTag: ed5e752bf3ad6d2c0d41d2cc289ded33524e2bee
  - name: test-cd-app-green
    newName: marlyt/test-cd-app
    newTag: 35b730d0bdb89a65651965847f94bf874013e085
patches:
  - patch: |-
      - op: replace
        path: /spec/selector/slot
        value: green
    target:
      kind: Service
      name: test-cd-app
