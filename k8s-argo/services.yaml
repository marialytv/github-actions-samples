apiVersion: v1
kind: Service
metadata:
  name: flask-app-active
spec:
  type: LoadBalancer
  selector:
    app: flask-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8050
---
apiVersion: v1
kind: Service
metadata:
  name: flask-app-preview
spec:
  type: ClusterIP
  selector:
    app: flask-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8050