apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-cd-app-green
  labels:
    app: test-cd-app
    slot: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: test-cd-app
      slot: green
  template:
    metadata:
      labels:
        app: test-cd-app
        slot: green
    spec:
      containers:
        - name: app
          image: test-cd-app-green
          ports:
            - containerPort: 8050
          readinessProbe:
            httpGet:
              path: /
              port: 8050
            initialDelaySeconds: 5
            periodSeconds: 5